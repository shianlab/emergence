name: Windows source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raster-probe:
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - run: node tests/raster-worker-diagnostic.cjs
        working-directory: emergence
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: emergence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          architecture: x64
      - run: npm ci
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: emergence/global.json
      - run: npm run setup:quality
      - run: npm run check
      - run: npm run build
      - name: Initialize isolated data test runtime
        run: |
          python -m venv .data-venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .data-venv/Scripts/python.exe -I -m pip install --require-hashes --only-binary=:all: -r src/domains/data/requirements-win32-py314.txt
      - run: npm test
      - run: npm run test:independent-windows:tui
      - name: Check terminal typography and input layout
        run: |
          node --experimental-ffi --import tsx tests/tui-small-text.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-ffi --import tsx tests/tui-small-text-layout.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --experimental-ffi --import tsx tests/tui-phase4.ts
      - run: npm run inspect:security
